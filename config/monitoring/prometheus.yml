# Prometheus: what to collect and how often
global:
  scrape_interval: 15s
  evaluation_interval: 15s          # check the alert rules every 15 seconds

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]   # where Prometheus sends firing alerts

scrape_configs:
  - job_name: srv-app
    static_configs:
      - targets: ["APP_PRIVATE_IP:9100"]   # replaced by setup-argus.sh at deployment

# Argus monitoring stack, started by scripts/setup-argus.sh on srv-argus
services:
  prometheus:
    image: prom/prometheus:v3.5.0          # fixed version: same result on every deployment
    ports:
      - "127.0.0.1:9090:9090"              # reachable from srv-argus only (Docker bypasses UFW)
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.0
    ports:
      - "127.0.0.1:3000:3000"
    env_file: .env                         # admin password, written by setup-argus.sh, never in Git
    volumes:
      - ./grafana/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
      - ./grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./grafana/node-exporter-full.json:/etc/grafana/dashboards/node-exporter-full.json:ro
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.28.1
    ports:
      - "127.0.0.1:9093:9093"        # reachable from srv-argus only, like the others
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    restart: unless-stopped



